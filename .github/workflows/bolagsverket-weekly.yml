name: Bolagsverket veckoscan

on:
  schedule:
    # Måndagar och torsdagar 05:00 UTC = 06:00/07:00 svensk tid.
    # Två gånger i veckan så att org.nr-cachen används oftare än var 7:e dag —
    # GitHub raderar cache som inte använts på 7 dagar, och då börjar scannen om från noll.
    - cron: '0 5 * * 1,4'
  workflow_dispatch: {}   # gör att du kan trigga den manuellt från GitHub-fliken "Actions"

permissions:
  contents: read
  actions: write   # behövs för keepalive-steget nedan

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Säkerställ unzip finns
        run: which unzip || (sudo apt-get update && sudo apt-get install -y unzip)

      - name: Installera beroenden
        run: npm install @neondatabase/serverless @vercel/blob@^2.9.0

      # Återställer förra veckans org.nr-lista (om den finns) till .cache/bv-seen.txt.gz
      # innan skriptet körs. Unik key per körning (run_id) gör att GitHub Actions alltid
      # sparar en NY cache-post i slutet av jobbet (post-steg, automatiskt) — restore-keys
      # ser till att den ändå hittar och laddar senaste tidigare snapshot vid start.
      - name: Återställ org.nr-snapshot från cache
        uses: actions/cache@v4
        with:
          path: .cache/bv-seen.txt.gz
          key: bv-seen-${{ github.run_id }}
          restore-keys: |
            bv-seen-

      # Watchlist-logiken (namnbyte/adressflytt) ligger inbyggd i bolagsverket-scan.mjs
      # — inget separat check_watchlist-skript behövs.
      - name: Kör Bolagsverket-scan
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          GITHUB_TIMESTAMP_TOKEN: ${{ secrets.GH_TIMESTAMP_TOKEN }}
          GITHUB_TIMESTAMP_REPO: ${{ secrets.GH_TIMESTAMP_REPO }}
          GITHUB_TIMESTAMP_PATH: ${{ secrets.GH_TIMESTAMP_PATH }}
          GITHUB_TIMESTAMP_BRANCH: ${{ secrets.GH_TIMESTAMP_BRANCH }}
        run: node scripts/bolagsverket-scan.mjs

      # GitHub pausar schemalagda workflows efter 60 dagar utan aktivitet i repot.
      # Detta återaktiverar workflowen varje vecka så att timern nollställs.
      - name: Keepalive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT repos/${{ github.repository }}/actions/workflows/bolagsverket-weekly.yml/enable
          gh api -X PUT repos/${{ github.repository }}/actions/workflows/main.yml/enable
