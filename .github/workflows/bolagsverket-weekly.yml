name: Bolagsverket veckoscan

on:
  schedule:
    # Måndagar 05:00 UTC = 06:00/07:00 svensk tid beroende på sommartid
    - cron: '0 5 * * 1'
  workflow_dispatch: {}   # gör att du kan trigga den manuellt från GitHub-fliken "Actions"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Säkerställ unzip finns
        run: which unzip || sudo apt-get update && sudo apt-get install -y unzip

      - name: Installera beroenden
        run: npm install @neondatabase/serverless

      # Återställer förra veckans org.nr-lista (om den finns) till .cache/bv-seen.txt.gz
      # innan skriptet körs. Unik key per körning (run_id) gör att GitHub Actions alltid
      # sparar en NY cache-post i slutet av jobbet (post-steg, automatiskt) — restore-keys
      # ser till att den ändå hittar och laddar senaste tidigare snapshot vid start.
      - name: Återställ org.nr-snapshot från cache
        uses: actions/cache@v4
        with:
          path: .cache/bv-seen.txt.gz
          key: bv-seen-${{ github.run_id }}
          restore-keys: |
            bv-seen-

      - name: Kör Bolagsverket-scan
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          GITHUB_TIMESTAMP_TOKEN: ${{ secrets.GH_TIMESTAMP_TOKEN }}
          GITHUB_TIMESTAMP_REPO: ${{ secrets.GH_TIMESTAMP_REPO }}
          GITHUB_TIMESTAMP_PATH: ${{ secrets.GH_TIMESTAMP_PATH }}
          GITHUB_TIMESTAMP_BRANCH: ${{ secrets.GH_TIMESTAMP_BRANCH }}
        run: node scripts/bolagsverket-scan.mjs
