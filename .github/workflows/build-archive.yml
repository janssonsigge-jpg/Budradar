name: Bygg historikarkiv och uppköpslista

on:
  schedule:
    # Varje natt 04:20 UTC: flaggningar + senaste insynsaffärer, sedan ny uppköpslista
    - cron: '20 4 * * *'
  workflow_dispatch:
    inputs:
      what:
        description: 'update (daglig), all (hela historiken), flags eller insider'
        required: true
        default: update
        type: choice
        options: [update, all, flags, insider]

permissions:
  contents: write

concurrency:
  group: build-archive
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Hämta arkiven
        run: node scripts/build-archive.mjs ${{ github.event.inputs.what || 'update' }}

      - name: Räkna fram uppköpslistan
        run: node scripts/takeover-rank.mjs

      - name: Committa
        run: |
          git config user.name "budradar-archive"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json.gz data/takeover.json
          if git diff --cached --quiet; then echo "Inget nytt"; exit 0; fi
          git commit -m "Uppköpslista och arkiv: $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
